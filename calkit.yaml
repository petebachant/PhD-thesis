owner: petebachant
name: phd-thesis
questions:
  - Why to cross-flow (vertical-axis) turbine wakes recover more quickly
    than axial-flow (horizontal-axis) turbine wakes?
  - What is a reasonable minimum threshold Reynolds number for physical
    models such that they will be useful for predicting full-scale performance?
  - How well do modern computational fluid dynamics (CFD) methods predict
    the performance and wake characteristics of these (relatively high-solidity)
    turbines?
publications:
  - path: thesis.pdf
    kind: phd-thesis
    title: Physical and numerical modeling of cross-flow turbines
  - path: index.html
    url: https://petebachant.me/PhD-thesis
    kind: presentation
    title: Defense slides
    description: >
      These are the slides from my dissertation defense.
showcase:
